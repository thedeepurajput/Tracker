name: expanse_tracker
description: A new Flutter project.
publish_to: 'none'
version: 3.1.10

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  sqflite: ^2.3.2
  path: ^1.8.3
  intl: ^0.19.0
  package_info_plus: ^5.0.1
  pdf: ^3.10.6
  open_file: ^3.3.2
  path_provider: ^2.1.1
  fl_chart: ^0.66.0
  local_auth: ^2.1.6
  google_fonts: ^6.1.0
  image_picker: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons:

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/image/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/image/logo.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/image/logo.png