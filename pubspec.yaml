name: tracker
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  sqflite: ^2.3.2
  path: ^1.8.3
  intl: ^0.18.1
  permission_handler: ^11.0.1
  share_plus: ^7.2.1
  pdf: ^3.10.6
  excel: ^4.0.3
  open_file: ^3.3.2
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/image/logo.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/image/logo.jpg